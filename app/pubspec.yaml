# Contraintes à rafraîchir via `flutter pub upgrade --major-versions` avant le premier build.
name: amiora
description: Application mobile premium de gestion des relations personnelles.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  drift: ^2.20.0
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.4
  purchases_flutter: ^8.1.0
  sentry_flutter: ^8.8.0
  sqlite3_flutter_libs: ^0.5.24
  supabase_flutter: ^2.6.0
  uuid: ^4.5.0

dev_dependencies:
  build_runner: ^2.4.11
  drift_dev: ^2.20.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Police embarquée (rendu hors-ligne déterministe, y compris web).
  # TODO(Phase 1): remplacer par Inter (variable), police officielle du
  # design system (Sprint 0 — livrable 3, § 3.1), licence OFL.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

# Environnement CI derrière proxy : le téléchargement des binaires sqlite3
# précompilés (native assets) y est altéré. On lie la libsqlite3 du système
# pour les tests hôte. Pour les builds device officiels, ce bloc peut être
# retiré (retour aux binaires précompilés vérifiés).
hooks:
  user_defines:
    sqlite3:
      source: system
